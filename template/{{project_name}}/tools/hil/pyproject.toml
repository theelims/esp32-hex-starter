[project]
name = "hil"
version = "0.1.0"
description = "Hardware-in-the-loop bench (SDS1104X-E + Nordic PPK2)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",      # pure-python VISA backend, no NI drivers
    "pyserial>=3.5",
    "ppk2-api>=0.9",       # Nordic PPK2
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hil"]

[tool.pytest.ini_options]
markers = ["hil: hardware-in-the-loop tests (require bench)"]
addopts = "-m 'not hil'"
