# Starter template. Fill in, then run `uv run gen-pins`.
# Importer (/board-onboarder) populates this from hardware/schematic.sch
# but will leave fields empty where it cannot determine a value.

board:
  name: ""                    # e.g. "thermostat-rev-a"
  revision: ""                # e.g. "A"
  mcu: ESP32-S3-WROOM-1-N16R8
  vcc_main_v: 3.3

buses:
  # Example entries — remove or replace.
  i2c0:
    sda: ""
    scl: ""
    speed_hz: 400000
  spi2:
    mosi: ""
    miso: ""
    sclk: ""
    speed_hz: 10000000

peripherals:
  # One entry per chip / device on the board. Keep the key stable — it
  # becomes the C++ constant name prefix in Pins.hpp.
  # Example:
  # imu:
  #   chip: LSM6DSO
  #   bus: spi2
  #   cs_pin: GPIO10
  #   int1_pin: GPIO5
  #   int2_pin: GPIO4
  #   address: null            # I2C only
  #   notes: ""

gpios:
  # Freestanding GPIOs that aren't tied to a peripheral object.
  # Example:
  # user_button:
  #   pin: GPIO0
  #   active_low: true
  #   pull: up
  #   notes: "BOOT button. Long-press 3s = factory reset."
  # status_led:
  #   pin: GPIO21
  #   active_low: false
