_min_copier_version: "9.3.0"
_subdirectory: template
_envops:
  keep_trailing_newline: true
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_jinja_extensions:
  - extensions.esp32_helpers:Esp32HelpersExtension
_exclude:
  - "[% if not hil_instruments %]*/tools/hil[% endif %]"
  - "[% if 'scope' not in hil_instruments %]*/tools/hil/hil/scope.py[% endif %]"
  - "[% if 'ppk2' not in hil_instruments %]*/tools/hil/hil/ppk2.py[% endif %]"
  - "[% if 'sigrok' not in hil_instruments %]*/tools/hil/hil/sigrok_la.py[% endif %]"
  - "[% if 'scope' not in hil_instruments %]*/tools/hil/tests/scope[% endif %]"
  - "[% if 'ppk2' not in hil_instruments %]*/tools/hil/tests/ppk2[% endif %]"
  - "[% if 'sigrok' not in hil_instruments %]*/tools/hil/tests/sigrok[% endif %]"

_message_after_copy: |
  Project scaffolded into ./[[ project_name ]]

  Next:
    cd [[ project_name ]]
    uv sync
    uv run pre-commit install
    uv run pre-commit install --hook-type pre-push
    pio run -e esp32s3

  Read CLAUDE.md for the agentic workflow and docs/ for the rationale.

project_name:
  type: str
  help: "Folder + git repo name (e.g. thermostat-rev-a). Lowercase, hyphens or underscores."
  validator: >-
    [% if not (project_name | regex_search('^[a-z][a-z0-9_-]{1,48}$')) %]
    Must be lowercase, start with a letter, max 49 chars, [a-z0-9_-] only.
    [% endif %]

project_description:
  type: str
  help: "One-sentence description of what this board does (shown in README)."
  default: "ESP32-S3 firmware project (hexagonal-lite)."

author_name:
  type: str
  help: "Author name (for LICENSE and pyproject.toml)."
  default: "Firmware Author"

author_email:
  type: str
  help: "Author email."
  default: "firmware@example.invalid"

module_part_number:
  type: str
  help: |
    Espressif module part number (master key — flash size, PSRAM mode,
    voltage, antenna are all derived from this). Examples:
    ESP32-S3-WROOM-1-N16R8, ESP32-S3-WROOM-1-N8R2, ESP32-C6-MINI-1-N4.
  default: "ESP32-S3-WROOM-1-N16R8"
  validator: >-
    [% if not (module_part_number | regex_search('^ESP32(-(C|S|H|P)\d+)?-(WROOM|WROVER|MINI|SOLO)-\d+U?(-[NH]\d+(R\d+V?)?)?$')) %]
    Must look like 'ESP32-S3-WROOM-1-N16R8'. See Espressif part-number guide.
    [% endif %]

partition_scheme:
  type: str
  help: |
    Flash partition layout. Sizes are scaled to flash_size_mb at scaffold time.
    'default' = single factory app + data. 'ota' = two OTA app slots + data.
    'huge_app' = one large factory app, minimal data. 'custom' = stub CSV that
    you fill in.
  choices:
    - default
    - ota
    - huge_app
    - custom
  default: default

cpu_freq_mhz:
  type: int
  help: "CPU frequency. 240 MHz is the S3/C6 maximum; lower for power savings."
  choices:
    - 80
    - 160
    - 240
  default: 240

console_baud:
  type: int
  help: "Cosmetic for `pio device monitor` UI. USB-Serial/JTAG ignores baud."
  default: 115200

hil_instruments:
  type: yaml
  multiselect: true
  help: |
    Which HIL bench instruments are available? Select all that apply.
    'scope'  = Siglent SDS1104X-E (SCPI/LAN).
    'ppk2'   = Nordic Power Profiler Kit II (USB serial).
    'sigrok' = any sigrok-compatible logic analyser (requires sigrok-cli system package).
    Leave empty to skip tools/hil/ entirely.
  choices:
    - scope
    - ppk2
    - sigrok
  default: [scope, ppk2]

cpp_standard:
  type: str
  help: "C++ standard for both the native test env and the IDF target. gnu++23 matches ESP-IDF 5.1+ defaults and is required for std::source_location."
  choices:
    - "gnu++23"
    - "gnu++26"
  default: "gnu++23"
