_subdirectory: template
_envops:
  keep_trailing_newline: true
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_jinja_extensions:
  - extensions.esp32_helpers:Esp32HelpersExtension
_exclude:
  - "[% if not enable_hil %]*/tools/hil[% endif %]"
  - "[% if not enable_mcp %].mcp.json[% endif %]"
  - "[% if pio_board_strategy != 'derive' %]*/boards[% endif %]"

_message_after_copy: |
  Project scaffolded into ./[[ project_name ]]

  Next:
    cd [[ project_name ]]
    uv sync
    uv run pre-commit install
    uv run pre-commit install --hook-type pre-push
    pio run -e esp32s3

  Read CLAUDE.md for the agentic workflow and docs/ for the rationale.

project_name:
  type: str
  help: "Folder + git repo name (e.g. thermostat-rev-a). Lowercase, hyphens or underscores."
  validator: >-
    [% if not (project_name | regex_search('^[a-z][a-z0-9_-]{1,48}$')) %]
    Must be lowercase, start with a letter, max 49 chars, [a-z0-9_-] only.
    [% endif %]

project_description:
  type: str
  help: "One-sentence description of what this board does (shown in README)."
  default: "ESP32-S3 firmware project (hexagonal-lite)."

author_name:
  type: str
  help: "Author name (for LICENSE and pyproject.toml)."
  default: "Firmware Author"

author_email:
  type: str
  help: "Author email."
  default: "firmware@example.invalid"

board_variant:
  type: str
  help: "Chip family. Drives a few sdkconfig and platformio.ini branches that PIO/IDF identify by family name."
  choices:
    - esp32-s3-devkitc-1
    - esp32-c6-devkitc-1
  default: esp32-s3-devkitc-1

module_part_number:
  type: str
  help: |
    Espressif module part number (master key — flash size, PSRAM mode,
    voltage, antenna are all derived from this). Examples:
    ESP32-S3-WROOM-1-N16R8, ESP32-S3-WROOM-1-N8R2, ESP32-C6-MINI-1-N4.
  default: "ESP32-S3-WROOM-1-N16R8"
  validator: >-
    [% if not (module_part_number | regex_search('^ESP32(-(C|S|H|P)\d+)?-(WROOM|WROVER|MINI|SOLO)-\d+U?(-[NH]\d+(R\d+V?)?)?$')) %]
    Must look like 'ESP32-S3-WROOM-1-N16R8'. See Espressif part-number guide.
    [% endif %]

pio_board_strategy:
  type: str
  help: |
    'derive' = scaffold a custom boards/<project>.json from module_part_number
    (recommended for production hardware). 'stock' = use one of PlatformIO's
    built-in board IDs (esp32-s3-devkitc-1 / esp32-c6-devkitc-1) — fine for
    prototyping with an Espressif dev kit.
  choices:
    - derive
    - stock
  default: derive

partition_scheme:
  type: str
  help: |
    Flash partition layout. Sizes are scaled to flash_size_mb at scaffold time.
    'default' = single factory app + data. 'ota' = two OTA app slots + data.
    'huge_app' = one large factory app, minimal data. 'custom' = stub CSV that
    you fill in.
  choices:
    - default
    - ota
    - huge_app
    - custom
  default: default

cpu_freq_mhz:
  type: int
  help: "CPU frequency. 240 MHz is the S3/C6 maximum; lower for power savings."
  choices:
    - 80
    - 160
    - 240
  default: 240

console_baud:
  type: int
  help: "Cosmetic for `pio device monitor` UI. USB-Serial/JTAG ignores baud."
  default: 115200

enable_hil:
  type: bool
  help: "Include the HIL bench (scope + PPK2) tooling under tools/hil/?"
  default: true

enable_mcp:
  type: bool
  help: "Configure MCP servers (.mcp.json) for Claude Code?"
  default: true

cpp_standard:
  type: str
  help: "C++ standard. gnu++17 is the ESP-IDF default sweet spot."
  choices:
    - "gnu++17"
    - "gnu++20"
  default: "gnu++17"
