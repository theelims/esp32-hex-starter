name: scaffold-matrix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    name: scaffold & lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hil_instruments:
          - "[]"
          - "[scope,ppk2,sigrok]"
        module_part_number:
          - ESP32-S3-WROOM-1-N16R8   # S3, octal PSRAM, 16 MB
          - ESP32-S3-WROOM-1-N4      # S3, no PSRAM, 4 MB
          - ESP32-C6-MINI-1-N4       # C6, no PSRAM, 4 MB
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install copier
        run: uv tool install copier
      - name: Scaffold
        run: |
          mkdir -p /tmp/scratch
          PYTHONPATH=. uv tool run copier copy --trust --defaults --force . /tmp/scratch \
            --data project_name=ci_demo \
            --data "hil_instruments=${{ matrix.hil_instruments }}" \
            --data module_part_number=${{ matrix.module_part_number }}
      - name: Assert structure
        run: |
          test -f /tmp/scratch/ci_demo/platformio.ini
          test -f /tmp/scratch/ci_demo/CLAUDE.md
          test -d /tmp/scratch/ci_demo/components/core
          if [[ "${{ matrix.hil_instruments }}" != "[]" ]]; then
            test -d /tmp/scratch/ci_demo/tools/hil
            test -f /tmp/scratch/ci_demo/tools/hil/hil/sigrok_la.py
            test -d /tmp/scratch/ci_demo/tools/hil/tests/sigrok
          else
            test ! -d /tmp/scratch/ci_demo/tools/hil
          fi

  native-build:
    name: pio test -e native
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install copier & platformio
        run: |
          uv tool install copier
          pip install platformio
      - name: Scaffold default project
        run: |
          mkdir -p /tmp/scratch
          PYTHONPATH=. uv tool run copier copy --trust --defaults --force . /tmp/scratch \
            --data project_name=ci_demo
      - name: Native tests
        working-directory: /tmp/scratch/ci_demo
        run: pio test -e native --without-uploading
